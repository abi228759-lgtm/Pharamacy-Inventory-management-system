<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<main class="container">
    <div th:if="${success}" class="alert ok" th:text="${success}"></div>
    <div th:if="${error}" class="alert bad" th:text="${error}"></div>
    <h1>Suppliers</h1>
    <section class="panel">
        <h2>Add supplier</h2>
        <form th:action="@{/suppliers/save}" method="post" class="grid">
            <div class="field"><label>Name</label><input type="text" name="name" required></div>
            <div class="field"><label>Phone</label><input type="text" name="phone"></div>
            <div class="field"><label>Email</label><input type="email" name="email"></div>
            <div class="field"><label>Address</label><input type="text" name="address"></div>
            <div class="field actions"><button type="submit" class="btn">Save supplier</button></div>
        </form>
    </section>
    <section class="panel">
        <h2>Supplier list</h2>
        <div class="table-wrap"><table>
            <thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Address</th><th></th></tr></thead>
            <tbody>
            <tr th:each="s : ${suppliers}">
                <td th:text="${s.name}"></td><td th:text="${s.phone}"></td><td th:text="${s.email}"></td><td th:text="${s.address}"></td>
                <td><form th:action="@{/suppliers/delete/{id}(id=${s.id})}" method="post" onsubmit="return confirm('Delete this supplier?');">
                    <button type="submit" class="btn btn-sm btn-danger">Delete</button></form></td>
            </tr>
            <tr th:if="${#lists.isEmpty(suppliers)}"><td colspan="5" class="empty">No suppliers yet.</td></tr>
            </tbody>
        </table></div>
    </section>
</main>
<div th:replace="~{fragments :: chatbot}"></div>
</body>
</html>
