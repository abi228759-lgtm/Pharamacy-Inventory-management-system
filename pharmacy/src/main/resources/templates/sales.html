<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales - Pharmacy</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<main class="container">
    <h1>Sales</h1>
    <div th:if="${success}" class="alert ok" th:text="${success}"></div>
    <div th:if="${error}" class="alert bad" th:text="${error}"></div>

    <section class="panel">
        <h2>New sale</h2>
        <form th:action="@{/sales/sell}" method="post" class="grid">
            <div class="field"><label>Medicine</label>
                <select name="medicineId" required>
                    <option th:each="m : ${available}" th:value="${m.id}"
                            th:text="${m.name} + ' (stock ' + ${m.quantity} + ', Rs. ' + ${m.price} + ')'"></option>
                </select></div>
            <div class="field"><label>Quantity</label><input type="number" name="quantity" min="1" value="1" required></div>
            <div class="field actions"><button type="submit" class="btn">Sell</button></div>
        </form>
    </section>

    <section class="panel">
        <h2>Recent sales</h2>
        <div class="table-wrap"><table>
            <thead><tr><th>Date</th><th>Medicine</th><th>Qty</th><th>Unit price</th><th>Total</th><th>Sold by</th></tr></thead>
            <tbody>
            <tr th:each="s : ${sales}">
                <td th:text="${s.soldAtDisplay}"></td>
                <td th:text="${s.medicineName}"></td>
                <td th:text="${s.quantity}"></td>
                <td th:text="${s.unitPrice}"></td>
                <td th:text="${s.total}"></td>
                <td th:text="${s.soldBy}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(sales)}"><td colspan="6" class="empty">No sales yet.</td></tr>
            </tbody>
        </table></div>
    </section>
</main>
<div th:replace="~{fragments :: chatbot}"></div>
</body>
</html>
