<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<main class="container">
    <div th:if="${success}" class="alert ok" th:text="${success}"></div>
    <div th:if="${error}" class="alert bad" th:text="${error}"></div>
    <h1>Feedback</h1>
    <section class="panel">
        <h2>Share your feedback</h2>
        <form th:action="@{/feedback/submit}" method="post">
            <div class="field"><label>Rating</label>
                <select name="rating" required>
                    <option value="5">5 - Excellent</option><option value="4">4 - Good</option><option value="3">3 - Average</option>
                    <option value="2">2 - Poor</option><option value="1">1 - Very poor</option>
                </select></div>
            <div class="field"><label>Message</label><textarea name="message" rows="4" maxlength="1000" required></textarea></div>
            <p><button type="submit" class="btn">Submit feedback</button></p>
        </form>
    </section>
    <section class="panel" th:if="${isAdmin}">
        <h2>All feedback <small th:text="'(average rating: ' + ${average} + ')'"></small></h2>
        <div class="table-wrap"><table>
            <thead><tr><th>Date</th><th>User</th><th>Rating</th><th>Message</th><th></th></tr></thead>
            <tbody>
            <tr th:each="f : ${feedbacks}">
                <td th:text="${f.createdAtDisplay}"></td><td th:text="${f.userName}"></td>
                <td th:text="${f.rating} + ' / 5'"></td><td th:text="${f.message}"></td>
                <td><form th:action="@{/feedback/delete/{id}(id=${f.id})}" method="post" onsubmit="return confirm('Delete this feedback?');">
                    <button type="submit" class="btn btn-sm btn-danger">Delete</button></form></td>
            </tr>
            <tr th:if="${#lists.isEmpty(feedbacks)}"><td colspan="5" class="empty">No feedback yet.</td></tr>
            </tbody>
        </table></div>
    </section>
</main>
<div th:replace="~{fragments :: chatbot}"></div>
</body>
</html>
