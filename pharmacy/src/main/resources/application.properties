spring.application.name=pharmacy
server.port=8080

# --- Database: H2 file DB (data survives restarts). Stored in ./data/ ---
spring.datasource.url=jdbc:h2:file:./data/pharmacydb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- To use MySQL instead, comment the H2 lines above and use these: ---
# spring.datasource.url=jdbc:mysql://localhost:3306/pharmacy?createDatabaseIfNotExist=true&serverTimezone=Asia/Kolkata
# spring.datasource.username=root
# spring.datasource.password=YOUR_PASSWORD

# --- First admin account (created on first start only). Change the password! ---
app.admin.email=admin@pharmacy.com
app.admin.password=admin123
app.billing.gst-percent=12
